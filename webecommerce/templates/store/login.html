{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-lock fa-3x text-primary mb-3"></i>
                        <h2 class="font-weight-bold">Welcome Back</h2>
                        <p class="text-muted">Log in to your TechStore account</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label for="id_username" class="small font-weight-bold text-uppercase">Username</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light border-right-0"><i class="fas fa-user text-muted"></i></span>
                                </div>
                                <input type="text" name="username" id="id_username" class="form-control border-left-0" placeholder="Enter your username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="id_password" class="small font-weight-bold text-uppercase">Password</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text bg-light border-right-0"><i class="fas fa-key text-muted"></i></span>
                                </div>
                                <input type="password" name="password" id="id_password" class="form-control border-left-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-sm mt-4">
                            Login <i class="fas fa-sign-in-alt ml-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Don't have an account?</p>
                        <a href="{% url 'register' %}" class="font-weight-bold text-primary">Create an account</a>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="text-muted small"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
